name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Test
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Annotate errors
        if: failure()
        shell: bash
        run: |
          cat build.log test.log 2>/dev/null | grep -E "error:|failed" | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done

  macos:
    name: macOS build + tests (arm64 & x86_64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build (debug, host)
        shell: bash
        run: swift build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Unit tests
        shell: bash
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: App bundle arm64
        shell: bash
        run: scripts/build-app.sh arm64 2>&1 | tee app-arm64.log; exit ${PIPESTATUS[0]}
      - name: App bundle x86_64
        shell: bash
        run: scripts/build-app.sh x86_64 2>&1 | tee app-x86_64.log; exit ${PIPESTATUS[0]}
      - name: Smoke-run jankprobe (no permissions needed)
        shell: bash
        timeout-minutes: 3
        run: |
          dist/arm64/jankprobe env
          dist/arm64/jankprobe rusage | tail -30
          dist/arm64/jankprobe topology | tail -20
          dist/arm64/jankprobe probe --seconds 8
          dist/x86_64/jankprobe env || echo 'x86_64 binary not runnable here (no Rosetta)'
          mkdir -p /tmp/jw && dist/arm64/jankprobe evaluate --data /tmp/jw
      - name: Smoke-run engine headless
        shell: bash
        timeout-minutes: 3
        run: |
          dist/arm64/jankprobe engine --seconds 20 --data /tmp/jw-engine
          ls -la /tmp/jw-engine /tmp/jw-engine/ticks
      - name: End-to-end engine under CPU stress (gate forced active)
        shell: bash
        timeout-minutes: 4
        run: |
          # No human is typing on a CI runner, so pretend the user is always active.
          mkdir -p /tmp/jw-e2e
          echo '{"idleAfterSec": 1e9, "userActiveWindowSec": 1e9, "frontProbeEnabled": false}' > /tmp/jw-e2e/config.json
          dist/arm64/jankprobe engine --seconds 90 --data /tmp/jw-e2e &
          ENGINE=$!
          sleep 40
          scripts/stress/cpu.sh 8 35
          wait $ENGINE
          echo "--- episodes:"; ls /tmp/jw-e2e/episodes
          for f in /tmp/jw-e2e/episodes/*.json; do [ -f "$f" ] && python3 -c "import json,sys; r=json.load(open(sys.argv[1])); d=r.get('diagnosis') or {}; print(r['episode']['id'][:8], d.get('cause'), d.get('headline'), [c['displayName'] for c in d.get('culprits',[])])" "$f"; done
          echo "--- baseline:"; cat /tmp/jw-e2e/baseline.json | head -c 600; echo
      - name: Annotate errors
        if: failure()
        shell: bash
        run: |
          cat *.log 2>/dev/null | grep -E "^/.*: error:|^error:" | sed -E 's#^.*/(Sources|Tests|Package)#\1#' | sort -u | head -45 | while IFS= read -r l; do echo "::error::$l"; done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JankWatch-builds
          path: |
            dist/*/JankWatch-*.zip
            dist/*/jankprobe
          retention-days: 14
